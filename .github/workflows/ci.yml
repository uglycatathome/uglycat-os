name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  install-smoke:
    name: 安装脚本冒烟（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 体检模式
        if: runner.os != 'Windows'
        run: bash install/setup.sh --check-only
      - name: 体检模式（Windows）
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File install/setup.ps1 -CheckOnly
      # 真正跑一遍安装，并验证启动器可用（只有 --check-only 不足以证明"装得上"）
      - name: 完整安装（Unix）
        if: runner.os != 'Windows'
        run: |
          bash install/setup.sh
          ./uglycat --help > /dev/null
          echo "install ok"
      - name: 完整安装（Windows）
        if: runner.os == 'Windows'
        run: |
          powershell -ExecutionPolicy Bypass -File install/setup.ps1
          .\uglycat.cmd --help | Out-Null
          Write-Output "install ok"
